<!DOCTYPE html>
<html lang="ru">
<head>
     <link rel="icon" href="./1000109366 (2)-photoaidcom-cropped.jpg" type="image/jpeg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turning — Рандомайзер пар</title>
    <link rel="icon" href="./unnamed.png" type="image/jpeg">
    <link rel="stylesheet" href="./style.css">
</head>
<body class="page page--generator">

    <div class="bg"></div>

    <!-- Кнопка истории -->
    <a href="history.html" class="history-link" aria-label="История">(=•́ܫ•̀=)</a>

    <!-- Результат -->
    <header class="result">
        <div class="result__line" id="result-line">
            <span class="result__placeholder">Начните шипперить прямо сейчас и попадите в ад бу-га-га </span>
        </div>
    </header>

    <!-- Игровое поле -->
    <main class="wheels">
        <!-- Карточка 1 -->
        <section class="wheel">
            <div id="slot-1" class="pair-card">
                <img id="img-1" alt="Персонаж 1" style="display: none;">
                <div class="pair-card__text" id="name-1">—</div>
            </div>
        </section>

        <!-- Разделитель -->
        <div class="pair-divider">+</div>

        <!-- Карточка 2 -->
        <section class="wheel">
            <div id="slot-2" class="pair-card">
                <img id="img-2" alt="Персонаж 2" style="display: none;">
                <div class="pair-card__text" id="name-2">—</div>
            </div>
        </section>
    </main>

    <!-- Кнопки -->
    <footer class="actions">
        <button id="spin-all" class="btn btn--primary" type="button">Начать шипп (⁄ ⁄•⁄ω⁄•⁄ ⁄)</button>
    </footer>

    <div id="toast" class="toast" hidden></div>

    <script src="./app.js"></script>
         <!-- Экран Джекпота -->
    <div id="jackpot-screen" class="jackpot-screen" hidden>
        <h1 class="jackpot-text">Вам выпал<br>сладкий канон!</h1>
    </div>
</body>
</html>
