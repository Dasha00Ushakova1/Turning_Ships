<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turning — Рандомайзер пар</title>
    <link rel="icon" href="./unnamed.png" type="image/jpeg">
    <link rel="stylesheet" href="./style.css">
</head>
<body class="page page--generator">

    <div class="bg"></div>

    <!-- Кнопка истории -->
    <a href="history.html" class="history-link" aria-label="История">📜</a>

    <!-- Результат -->
    <header class="result">
        <div class="result__line" id="result-line">
            <span class="result__placeholder">Нажмите «Сгенерировать», чтобы создать пару</span>
        </div>
    </header>

    <!-- Игровое поле -->
    <main class="wheels" style="flex-direction: row; justify-content: center; align-items: center; gap: 20px;">
        
        <!-- Карточка 1 -->
        <section class="wheel" style="padding: 10px; width: 250px;">
            <div id="slot-1" class="pair-card">
                <img id="img-1" src="" alt="Персонаж 1" style="display: none;">
                <div class="pair-card__text" id="name-1">—</div>
            </div>
        </section>

        <!-- Разделитель -->
        <div style="font-size: 30px; color: var(--color-accent); font-weight: bold; font-family: var(--font-fancy);">+</div>

        <!-- Карточка 2 -->
        <section class="wheel" style="padding: 10px; width: 250px;">
            <div id="slot-2" class="pair-card">
                <img id="img-2" src="" alt="Персонаж 2" style="display: none;">
                <div class="pair-card__text" id="name-2">—</div>
            </div>
        </section>

    </main>

    <!-- Кнопки -->
    <footer class="actions">
        <button id="spin-all" class="btn btn--primary" type="button">🔮 Сгенерировать пару</button>
    </footer>

    <div id="toast" class="toast" hidden></div>

    <script src="./app.js"></script>
</body>
</html>
